global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'surrealdb-monitoring'

# Alertmanager configuration (optional)
#alerting:
#  alertmanagers:
#    - static_configs:
#        - targets: []
#          # - alertmanager:9093

# Load rules once and periodically evaluate them
#rule_files:
# - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # SurrealDB Exporter
  - job_name: 'surrealdb-exporter'
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['surrealdb-exporter:9224']
        labels:
          cluster: 'local-test-cluster'
          environment: 'development'
    # Optional: Add relabeling if needed
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: __param_target
    #   - source_labels: [__param_target]
    #     target_label: instance
    #   - target_label: __address__
    #     replacement: surrealdb-exporter:9224

  # Optional: Add additional SurrealDB exporters for multiple clusters
  # - job_name: 'surrealdb-exporter-prod'
  #   static_configs:
  #     - targets: ['surrealdb-exporter-prod:9224']
  #       labels:
  #         cluster: 'production-cluster'
  #         environment: 'production'
