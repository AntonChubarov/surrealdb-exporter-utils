events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Логування
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Налаштування upstream для SurrealDB кластера
    upstream surrealdb_cluster {
        least_conn;  # Алгоритм балансування: найменше з'єднань

        server 192.168.1.161:8000 max_fails=3 fail_timeout=30s weight=1;
        server 192.168.1.182:8000 max_fails=3 fail_timeout=30s weight=1;
        server 192.168.1.203:8000 max_fails=3 fail_timeout=30s weight=1;

        keepalive 32;  # Keep-alive з'єднання для кращої продуктивності
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;

        # Базовий health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Проксі до SurrealDB кластера
        location / {
            proxy_pass http://surrealdb_cluster;

            # WebSocket підтримка (критично для SurrealDB)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Заголовки для проксі
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаути
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Буферизація
            proxy_buffering off;
            proxy_request_buffering off;

            # Retry логіка
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Статистика Nginx (опціонально)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;
        }
    }
}
