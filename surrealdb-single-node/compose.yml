version: '3.9'

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    hostname: surrealdb
    restart: unless-stopped
    ports:
      - "8000:8000"
    command:
      - start
      - --bind
      - 0.0.0.0:8000
      - --user
      - root
      - --pass
      - SecurePassword123!
      - --log
      - info
      - memory
    networks:
      - surreal-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  surreal-network:
    name: surreal-network
    driver: bridge
